services:
  captcha-solver:
    build:
      context: ../..
      dockerfile: services/captcha-solver/Dockerfile
    ports:
      - "127.0.0.1:8855:8855"
    environment:
      CAPTCHA_API_KEY: "${CAPTCHA_API_KEY:?configure CAPTCHA_API_KEY}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    restart: unless-stopped
